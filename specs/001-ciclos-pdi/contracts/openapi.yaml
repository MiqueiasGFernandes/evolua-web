openapi: 3.1.0
info:
  title: Evolua PDI API
  version: 1.0.0
  description: Contrato canônico para gerenciamento de ciclos de PDI.
servers:
  - url: /api/v1
tags:
  - name: PDI Cycles
paths:
  /pdi-cycles:
    post:
      operationId: createPdiCycle
      tags: [PDI Cycles]
      summary: Criar ciclo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePdiCycleRequest' }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/PdiCycle' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listPdiCycles
      tags: [PDI Cycles]
      summary: Listar ciclos próprios
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Lista paginada, content: { application/json: { schema: { $ref: '#/components/schemas/PagedPdiCycles' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /pdi-cycles/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getPdiCycle
      tags: [PDI Cycles]
      summary: Detalhar ciclo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Detalhe, content: { application/json: { schema: { $ref: '#/components/schemas/PdiCycleDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updatePdiCycle
      tags: [PDI Cycles]
      summary: Editar ciclo aberto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePdiCycleRequest' }
      responses:
        '200': { description: Atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/PdiCycle' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /pdi-cycles/{id}/activate:
    post:
      operationId: activatePdiCycle
      tags: [PDI Cycles]
      summary: Ativar ciclo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ativado, content: { application/json: { schema: { $ref: '#/components/schemas/PdiCycle' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /pdi-cycles/{id}/complete:
    post:
      operationId: completePdiCycle
      tags: [PDI Cycles]
      summary: Concluir ciclo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Concluído, content: { application/json: { schema: { $ref: '#/components/schemas/PdiCycle' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /pdi-cycles/{id}/cancel:
    post:
      operationId: cancelPdiCycle
      tags: [PDI Cycles]
      summary: Cancelar ciclo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cancelado, content: { application/json: { schema: { $ref: '#/components/schemas/PdiCycle' } } } }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Status: { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/PdiStatus' } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  schemas:
    PdiStatus: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, CANCELLED] }
    DurationType: { type: string, enum: [TRIMESTER, SEMESTER, YEAR, CUSTOM] }
    CreatePdiCycleRequest:
      type: object
      required: [title, start_date, end_date, duration_type]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        duration_type: { $ref: '#/components/schemas/DurationType' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    UpdatePdiCycleRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        duration_type: { $ref: '#/components/schemas/DurationType' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    PdiCycle:
      type: object
      required: [id, owner_id, title, duration_type, start_date, end_date, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        duration_type: { $ref: '#/components/schemas/DurationType' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/PdiStatus' }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StatusHistory:
      type: object
      required: [id, to_status, occurred_at, actor_id]
      properties:
        id: { type: string, format: uuid }
        from_status: { anyOf: [{ $ref: '#/components/schemas/PdiStatus' }, { type: 'null' }] }
        to_status: { $ref: '#/components/schemas/PdiStatus' }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
    PdiCycleDetail:
      allOf:
        - $ref: '#/components/schemas/PdiCycle'
        - type: object
          required: [history]
          properties: { history: { type: array, items: { $ref: '#/components/schemas/StatusHistory' } } }
    PagedPdiCycles:
      type: object
      required: [items, page, page_size, total, has_next]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PdiCycle' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        has_next: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors: { type: array, items: { type: object } }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

